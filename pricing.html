<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Plan · Smart Dental Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=General+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/style-v3.css">
<style>
  body {
    background: var(--color-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: var(--space-6);
  }
  .pricing-container {
    max-width: 1000px;
    width: 100%;
    margin: 0 auto;
  }
  .pricing-header {
    text-align: center;
    margin-bottom: var(--space-8);
  }
  .pricing-header h1 {
    font-family: var(--font-serif);
    font-size: var(--text-2xl);
    color: var(--color-text);
    margin-bottom: var(--space-2);
  }
  .pricing-header p {
    color: var(--color-text-muted);
  }
  .plans-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: var(--space-6);
  }
  .plan-card {
    background: var(--color-surface);
    border: 1px solid var(--color-divider);
    border-radius: var(--radius-lg);
    padding: var(--space-6);
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, border-color 0.2s;
  }
  .plan-card:hover {
    transform: translateY(-4px);
    border-color: var(--color-primary);
  }
  .plan-card.popular {
    border-color: var(--color-primary);
    box-shadow: 0 4px 12px rgba(var(--color-primary-rgb), 0.1);
    position: relative;
  }
  .popular-badge {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--color-primary);
    color: white;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: var(--text-xs);
    font-weight: 600;
  }
  .plan-name {
    font-size: var(--text-lg);
    font-weight: 600;
    margin-bottom: var(--space-2);
    color: var(--color-text);
  }
  .plan-price {
    font-size: var(--text-2xl);
    font-weight: 700;
    color: var(--color-text);
    margin-bottom: var(--space-6);
  }
  .plan-price span {
    font-size: var(--text-sm);
    color: var(--color-text-muted);
    font-weight: 400;
  }
  .plan-features {
    list-style: none;
    padding: 0;
    margin: 0 0 var(--space-6) 0;
    flex: 1;
  }
  .plan-features li {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-bottom: var(--space-3);
    color: var(--color-text-muted);
    font-size: var(--text-sm);
  }
  .plan-features li svg {
    width: 16px;
    height: 16px;
    color: var(--color-primary);
  }
  .btn-select-plan {
    width: 100%;
  }
  #loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(var(--color-bg-rgb), 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #loading-overlay.active {
    visibility: visible;
    opacity: 1;
  }
</style>
</head>
<body>

<div id="loading-overlay">
  <div class="loader" style="width: 40px; height: 40px; border: 3px solid var(--color-divider); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
</div>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<div class="pricing-container">
  <div class="pricing-header">
    <h1>Start Your 3-Month Trial</h1>
    <p>Choose a plan to continue. Your card will not be charged until the trial ends.</p>
  </div>

  <div class="plans-grid" id="plans-container">
    <!-- Populated via JS -->
  </div>
</div>

<script src="./assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const token = localStorage.getItem('sdd_token');
  if (!token) {
    window.location.href = './login.html';
    return;
  }

  // If they already have an active subscription, send to dashboard
  try {
    const subData = await window.api.getBillingStatus();
    if (subData.subscription && ['trialing','active'].includes(subData.subscription.status)) {
      window.location.href = './dashboard.html';
      return;
    }
  } catch (e) {
    // No subscription yet (expected for new users) — show plans
  }

  loadPlans();
});

async function loadPlans() {
  const container = document.getElementById('plans-container');
  container.innerHTML = 'Loading plans...';
  
  try {
    const data = await window.api.getPlans();
    container.innerHTML = '';
    
    const plans = data.plans;
    
    const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    const xIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;

    const formatPrice = (p) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(p);

    const starterHTML = `
      <div class="plan-card">
        <div class="plan-name">Starter</div>
        <div class="plan-price">${formatPrice(plans.starter.price)}<span>/month</span></div>
        <ul class="plan-features">
          <li>${checkIcon} ${plans.starter.credits.toLocaleString()} AI Credits/month</li>
          <li>${checkIcon} Ultra AI for Data</li>
          <li>${checkIcon} Nano AI for Automation</li>
          <li style="opacity: 0.5">${xIcon} Marketplace Listing</li>
        </ul>
        <button class="btn btn-outline btn-select-plan" onclick="selectPlan('starter')">Start 3-Month Trial</button>
      </div>
    `;

    const growthHTML = `
      <div class="plan-card popular">
        <div class="popular-badge">Most Popular</div>
        <div class="plan-name">Growth</div>
        <div class="plan-price">${formatPrice(plans.growth.price)}<span>/month</span></div>
        <ul class="plan-features">
          <li>${checkIcon} ${plans.growth.credits.toLocaleString()} AI Credits/month</li>
          <li>${checkIcon} Ultra AI for Data &amp; Thinking</li>
          <li>${checkIcon} Nano AI for Automation</li>
          <li>${checkIcon} Premium Marketplace Listing</li>
        </ul>
        <button class="btn btn-primary btn-select-plan" onclick="selectPlan('growth')">Start 3-Month Trial</button>
      </div>
    `;

    const premiumHTML = `
      <div class="plan-card">
        <div class="plan-name">Premium</div>
        <div class="plan-price">${formatPrice(plans.premium.price)}<span>/month</span></div>
        <ul class="plan-features">
          <li>${checkIcon} ${plans.premium.credits.toLocaleString()} AI Credits/month</li>
          <li>${checkIcon} Super AI for Thinking</li>
          <li>${checkIcon} Ultra AI for Automation</li>
          <li>${checkIcon} Priority Marketplace Listing</li>
        </ul>
        <button class="btn btn-outline btn-select-plan" onclick="selectPlan('premium')">Start 3-Month Trial</button>
      </div>
    `;

    container.innerHTML = starterHTML + growthHTML + premiumHTML;

  } catch (err) {
    container.innerHTML = `<p style="color:red">Error loading plans: ${err.message}</p>`;
  }
}

window.selectPlan = async function(plan) {
  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('active');
  
  try {
    const data = await window.api.createTrial(plan);
    
    if (data.subscription_link) {
      window.location.href = data.subscription_link;
    } else {
      alert('Could not start trial. Missing checkout link. Please contact support.');
      overlay.classList.remove('active');
    }
  } catch (err) {
    alert(err.message || 'Something went wrong. Please try again.');
    overlay.classList.remove('active');
  }
};
</script>
</body>
</html>
